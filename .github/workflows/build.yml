name: Build and test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-22.04
            shell: bash
            cc: gcc
            extension: ''
          - target: windows-amd64
            runner: windows-2025
            shell: 'msys2 {0}'
            cc: gcc
            extension: .exe
          - target: darwin-arm64
            runner: macos-15
            shell: bash
            cc: clang
            extension: ''
          - target: darwin-amd64
            runner: macos-15-intel
            shell: bash
            cc: clang
            extension: ''
    defaults:
      run:
        shell: ${{ matrix.shell }}
    env:
      CGO_ENABLED: '1'
      CC: ${{ matrix.cc }}
      TARGET: ${{ matrix.target }}
      EXE_EXTENSION: ${{ matrix.extension }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Windows C compiler
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: UCRT64
          path-type: inherit
          update: true
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Check toolchains and target
        run: |
          set -euo pipefail
          go version
          "$CC" --version
          java -version
          actual="$(go env GOOS)-$(go env GOARCH)"
          test "$actual" = "$TARGET"
      - name: Test
        run: go test -v ./...
      - name: Vet
        run: go vet ./...
      - name: Build and smoke test
        run: |
          set -euo pipefail
          mkdir -p dist/package
          go build -trimpath -o "dist/package/litosfera-go${EXE_EXTENSION}" .
          "./dist/package/litosfera-go${EXE_EXTENSION}" --help
          cp README.md PROTOCOL.md dist/package/
      - name: Package Unix executable
        if: runner.os != 'Windows'
        run: tar -czf "dist/litosfera-go-${TARGET}.tar.gz" -C dist/package .
      - name: Package Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/package/* -DestinationPath "dist/litosfera-go-$env:TARGET.zip"
      - name: Upload build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: litosfera-go-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: litosfera-go-*
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist
        run: sha256sum litosfera-go-* > SHA256SUMS.txt
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/litosfera-go-*
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$TAG"
          fi
